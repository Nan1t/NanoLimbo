name: Java CI with Gradle
on:
  release:
    types: [published]
permissions:
  contents: write
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: "temurin"
        cache: gradle
    - name: Current Java version
      run: java -version
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Build with Gradle
      run: gradle build
    - name: Upload to the GitHub release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "${{ github.event.release.tag_name }}" build/libs/NanoLimbo.jar --clobber
    - name: Set up QEMU
      if: github.repository == 'Nan1t/NanoLimbo'
      uses: docker/setup-qemu-action@v4.4.0
    - name: Set up Docker Buildx
      if: github.repository == 'Nan1t/NanoLimbo'
      uses: docker/setup-buildx-action@v4.4.1
    - name: Extract Docker metadata
      if: github.repository == 'Nan1t/NanoLimbo'
      id: meta
      uses: docker/metadata-action@v6.2.0
      with:
        images: ghcr.io/nan1t/nanolimbo
        flavor: latest=false
        tags: |
          type=ref,event=tag
          type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}
    - name: Log in to GHCR
      if: github.repository == 'Nan1t/NanoLimbo'
      uses: docker/login-action@v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and publish Docker image
      if: github.repository == 'Nan1t/NanoLimbo'
      uses: docker/build-push-action@v7.4.0
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
